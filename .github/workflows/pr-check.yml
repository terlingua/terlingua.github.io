name: PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TESTINGPLATFORM_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Restore
        run: dotnet restore

      - name: Process content
        run: dotnet run --project tools/ObserverMagazine.ContentProcessor --no-restore

      - name: Test
        run: dotnet test --solution ObserverMagazine.slnx --no-restore

      - name: Publish
        run: dotnet publish src/ObserverMagazine.Web/ObserverMagazine.Web.csproj -c Release -o publish

      - name: Prepare preview
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Upload preview site
        uses: actions/upload-artifact@v7
        with:
          name: site-preview
          path: publish/wwwroot
          retention-days: 7
