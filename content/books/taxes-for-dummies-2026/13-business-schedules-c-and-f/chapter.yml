title: 'Business Tax Schedules: C and F'
summary: Who files Schedule C; cash, accrual and hybrid accounting; 1099 reporting thresholds; gross receipts, 1099-K and cost of goods sold; car expenses and commuting; MACRS depreciation, conventions, Section 179 and bonus depreciation, and vehicle limits (with corrections on heavy SUVs); the other expense lines, travel and 50% meals; the home office; start-up costs, at-risk and hobby rules; and Schedule F for farmers, plus the gig economy (book pp. 261–304).
