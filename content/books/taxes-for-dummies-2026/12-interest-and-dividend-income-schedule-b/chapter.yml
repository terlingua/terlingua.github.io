title: 'Interest and Dividend Income: Schedule B'
summary: When Schedule B is required; reading Forms 1099-INT, 1099-OID and 1099-DIV; backup withholding and CP2000 notices; nominee and accrued-interest adjustments; savings bonds, T-bills, TIPS, zero-coupon bonds, premiums and market discount; the education savings bond exclusion; below-market loans and imputed interest; qualified and nonqualified dividends, return of capital and stock splits; and foreign accounts — FBAR, Form 8938 and Form 3520 (book pp. 241–259).
