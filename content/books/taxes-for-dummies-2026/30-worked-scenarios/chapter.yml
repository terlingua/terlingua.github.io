title: 'Putting It Together: Worked Scenarios'
summary: End-to-end 2025 returns computed step by step — a single software engineer with equity, a married couple with children deciding whether to itemize, a freelancer with self-employment tax, QBI and a SEP, and a retired couple with Social Security and the new senior deduction — plus a mixed capital-gains-and-home-sale netting exercise. Each step is a question, and the arithmetic is shown in the explanations.
