title: Other Schedules and Forms to File
summary: Estimated taxes and the safe harbors, military moving expenses, Form 8606 and the pro-rata rule for nondeductible IRAs, Roth conversions and Roth distributions, the kiddie tax (Forms 8615 and 8814), the home office deduction (Form 8829 and the simplified method), W-4 withholding, the nanny tax (Schedule H) and self-employment tax (Schedule SE), with several corrections to dates, thresholds and line numbers (book pp. 371–390).
