title: Small-Business Tax Planning
summary: Record-keeping and separate accounts, the hobby loss rules, payroll and 1099 duties, cash-method timing, the QBI deduction (with a corrected example), section 179 and depreciation choices, vehicles, travel and meals, home office versus outside space, contractors versus employees, benefits and hiring family members, interest and NOL limits, and choosing between sole proprietorship, LLC, S corporation and C corporation (book pp. 493–510).
