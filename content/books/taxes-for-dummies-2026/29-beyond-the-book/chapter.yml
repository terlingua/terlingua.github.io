title: 'Beyond the Book: Tax Year 2026, 2027 and Post-Print Changes'
summary: What changed after the book went to press in late 2025 — tax year 2026 figures (returns filed in 2027), OBBBA provisions that start in 2026, the temporary 2025–2028 deductions, IRS administrative changes in 2026 (Direct File's end, automatic penalty relief, the paper-check phase-out, the redesigned Form 1040, Form 1099-DA), the expired premium tax credit enhancement, Trump accounts and the first 2027 figures — plus a digest of the book's most consequential errors.
