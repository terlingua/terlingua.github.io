title: Real Estate and Taxes
summary: Homeowner tax breaks (mortgage interest, SALT, the home sale exclusion, nondeductible losses), the trap in converting a rental into a residence, buying decisions and basis tracking, mortgage choices (15 vs 30 years, down payment, refinancing, home equity borrowing with a major correction), selling and converting homes, divorce transfers, and rental investing — depreciation, the $25,000 allowance, 1031 exchanges and entities (book pp. 527–544).
