title: What Kind of Taxpayer Are You?
summary: Forms 1040, 1040-SR and 1040-NR and Schedules 1–3; standard versus itemized deductions; the five filing statuses; married filing separately and the marriage penalty; head of household and qualifying surviving spouse; qualifying children and qualifying relatives; when dependents must file; returns for a deceased taxpayer; filing thresholds (corrected), deadlines, extensions and how to file (book pp. 43–68).
