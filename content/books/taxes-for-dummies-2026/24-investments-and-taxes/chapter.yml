title: Your Investments and Taxes
summary: 'Tax-efficient investing outside retirement accounts: buy-and-hold for long-term rates (with a corrected 2025 rate table), paying off debt, funding retirement accounts, tax-free money market and bond funds with tax-equivalent yield arithmetic, tax-friendly and index funds, fund distribution timing, products to avoid (limited partnerships, cash-value life insurance, most annuities), and selling decisions — specific identification, FIFO, average cost, gains, losses, wash sales, stock options and unknown basis (book pp. 511–526).'
