title: Fixing Mistakes the IRS Makes
summary: The common IRS errors (misapplied payments, holiday due dates, wrong or double-counted income, lost returns), how to write a short effective response, proving timely filing, erroneous refunds, the Taxpayer Advocate Service, and finding, receiving and claiming refunds — interest on refunds, joint and injured-spouse refunds, deceased taxpayers, the refund statute of limitations and protective claims (book pp. 415–431).
