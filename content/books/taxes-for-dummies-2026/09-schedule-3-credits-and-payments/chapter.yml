title: 'Form 1040, Schedule 3: Credits and Payments'
summary: Credits versus deductions, refundable versus nonrefundable; the foreign tax credit; the dependent care, American opportunity and lifetime learning credits (with a corrected rate); the saver's credit; residential energy credits and their end under OBBBA; the clean vehicle credit's expiry; the elderly or disabled credit (corrected); mortgage credit certificates; and payments such as extension payments and excess Social Security withholding (book pp. 171–182).
