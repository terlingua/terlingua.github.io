title: 'Dreaded Envelopes: IRS Notices, Assessments and Audits'
summary: How the IRS notice stream works from first notice to levy, the main notice types (CP2000 underreporting, nonfiler, backup withholding, lien and levy), Collection Due Process rights, the four audit types and how to handle them, the statutes of limitations on assessment and collection, appeals, and the 90-day Statutory Notice of Deficiency, with corrections on backup withholding, liens on credit reports, bank levies and deadlines (book pp. 393–414).
