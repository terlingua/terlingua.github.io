title: 'Form 1040, Schedule 1, Part I: Additional Income'
summary: Taxable state refunds and the tax benefit rule, alimony under old and new divorce rules, business, rental and farm income lines, unemployment and repayments, net operating losses and the excess business loss limit, gambling, cancelled debt and foreclosures, the foreign earned income exclusion, HSA and ABLE distributions, hobbies, prizes, stock options and the rest of line 8 (book pp. 111–128).
