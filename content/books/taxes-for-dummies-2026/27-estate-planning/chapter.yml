title: Estate Planning
summary: Who owes federal and state estate or inheritance taxes (2025–2027 exemptions, state thresholds), computing the taxable estate, wills and powers of attorney, lifetime gifting and the annual exclusion, choosing what to give (step-up at death), the unlimited marital deduction, bypass trusts versus portability (a key omission in the book), life insurance and ILITs, living trusts and probate, disclaimers, charitable trusts, and getting objective help (book pp. 559–570).
