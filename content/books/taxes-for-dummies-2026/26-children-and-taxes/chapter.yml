title: Children and Taxes
summary: Child-related tax benefits (SSNs, the dependent care credit and accounts, child and adoption credits, the second-income decision), the hidden "financial aid tax", education saving vehicles (529 plans, Coverdell ESAs, 529-to-Roth rollovers, savings bonds), education credits and the student loan interest deduction, paying for college, the kiddie tax and custodial accounts — plus the new Trump accounts created after the book went to press (book pp. 545–558).
