title: Fixing Your Own Mistakes
summary: Amending returns with Form 1040X, NOLs and the tax benefit rule; options when you can't pay (installment agreements, currently-not-collectible status, offers in compromise, bankruptcy); penalty abatement for reasonable cause and the new Automatic Exemption from Penalty that replaces First Time Abate; abating interest; innocent spouse, separation of liability, equitable and injured spouse relief; and the Taxpayer Bill of Rights, with corrections on the failure-to-file penalty and bankruptcy counselling (book pp. 433–460).
