title: 'All the Form 1040s: Income Stuff'
summary: The top of Form 1040, what counts as income, wages and the W-2, interest and dividends, IRA distributions and required minimum distributions, inherited IRAs after the SECURE Act, pensions, annuities, rollovers and early-distribution exceptions, Social Security taxation with worked worksheets, and the miscellany that reaches line 8 (book pp. 71–110).
