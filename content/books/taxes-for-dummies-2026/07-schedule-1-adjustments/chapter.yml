title: 'Form 1040, Schedule 1, Part II: Adjustments to Income'
summary: Adjusted gross income and why it matters; educator and other worker expenses; the HSA deduction; self-employment adjustments (half of SE tax, SEP, SIMPLE, solo 401(k) and defined benefit plans, health insurance); early-withdrawal penalties; alimony paid; the traditional IRA deduction with corrected phase-out arithmetic, spousal and nondeductible IRAs and the backdoor Roth; student loan interest; and the other line 24 adjustments (book pp. 129–156).
