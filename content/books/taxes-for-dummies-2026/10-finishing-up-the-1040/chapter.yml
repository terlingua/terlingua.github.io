title: Finishing Up the 1040
summary: From AGI to taxable income (standard or itemized deduction, the qualified business income deduction and the new Schedule 1-A deductions); computing tax with rate schedules and the qualified dividends and capital gain worksheet, with worked examples; the kiddie tax boxes; credits on lines 19–22; withholding, estimated payments, the earned income and refundable credits; refunds (and the end of paper checks), balances due and the estimated tax penalty (book pp. 183–200).
