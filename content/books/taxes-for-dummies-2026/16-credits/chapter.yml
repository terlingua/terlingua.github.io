title: Giving Credits Where Credits Are Due
summary: Refundable versus nonrefundable credits; the child and dependent care credit and employer dependent care accounts (with the 2026 OBBBA expansion); the elderly or disabled credit; education credits; the child tax credit and credit for other dependents; the saver's credit; residential energy, adoption and clean vehicle credits (with their 2025 endings and the new refundable adoption credit); and the earned income tax credit (book pp. 355–370).
