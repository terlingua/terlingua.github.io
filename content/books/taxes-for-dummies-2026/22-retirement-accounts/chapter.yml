title: Trimming Taxes with Retirement Accounts
summary: Why retirement accounts are "tax-reduction accounts"; early withdrawal penalties and exceptions (age 55 separation, SEPP, newer SECURE 2.0 exceptions); 2025 limits for 401(k), 403(b), SIMPLE, SEP, solo 401(k), defined benefit plans and IRAs; Roth versus traditional; annuities; rollovers; required minimum distributions, QCDs and inherited accounts; and pension payout choices, with corrections on 403(b) limits, solo 401(k) mechanics, RMD tables, the still-working exception and QCD age (book pp. 471–492).
