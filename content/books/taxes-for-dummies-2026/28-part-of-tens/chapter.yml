title: 'The Part of Tens: Audits, Overlooked Savings and Choosing an Advisor'
summary: 'Chapters 28–30 of the book in one place: practical ways to lower audit risk (accuracy, matching income, honest deductions, avoiding refund mills and hobby losses, filing, careful self-employment reporting); overlooked tax savers (tax-efficient cash and growth assets, retirement and backdoor Roth accounts, the foreign earned income exclusion, itemizing checks, charitable mileage and noncash gifts, self-employment deductions), with a repeat correction on home equity interest; and the questions to ask a tax advisor (book pp. 573–589).'
