title: 'Capital Gains and Losses: Schedule D and Form 8949'
summary: Capital assets and holding periods; netting gains and losses and the $3,000 limit; Form 8949 boxes (including the new 2025 digital asset boxes); adjusted basis for purchases, gifts, inheritances, reinvested dividends and partial sales; depreciation recapture and installment sales; the home sale exclusion; worthless stock, wash sales, Section 1244 stock, stock options, 83(b) elections and employer stock; nonbusiness bad debts; traders and mark-to-market; and cryptocurrency, with two important corrections (book pp. 305–336).
