title: 'Form 1040, Schedule 2: Additional Taxes'
summary: The alternative minimum tax with a worked example (and a corrected figure); reconciling the premium tax credit, with the rules that actually applied in 2025 and what changed for 2026; self-employment tax; tip and misclassified-wage FICA; the nanny tax; the 0.9% Additional Medicare Tax and 3.8% net investment income tax with arithmetic; and the miscellany of Schedule 2 (book pp. 157–170).
