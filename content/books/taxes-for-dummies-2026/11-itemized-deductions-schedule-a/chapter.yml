title: 'Itemized Deductions: Schedule A'
summary: Standard deduction amounts and the senior bonus; when to itemize and "bunching"; medical expenses and the 7.5% floor; state and local taxes and the new $40,000 cap with its phase-down; mortgage interest, points and investment interest; charitable gifts, substantiation, property, AGI limits (with a corrected DAF limit) and QCDs; casualty losses; and the few remaining "other" itemized deductions, plus the 2026 changes (book pp. 203–240).
