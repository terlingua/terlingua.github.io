title: 'See What You Made Me Do (UK Edition): A Concept Companion for Software Engineers'
author: kushal
date: 2026-11-18
summary: 'Concept-first companion to Jess Hill''s See What You Made Me Do: Power, Control and Domestic Abuse (revised UK edition, Hurst, 2020), chapter by chapter in the book''s order, including the Dadirri appendix. Each section explains the ideas in plain language — coercive control and Biderman''s Chart of Coercion, why victims stay and resist, typologies of abusers, shame and entitlement, patriarchy, children, women''s violence and the Conflict Tactics Scale, policing, refuges and family courts, and what reduces abuse — and ends with questions whose explanations teach the concept in full, quote the book with page pointers and cite primary sources. A closing chapter records law reform and corrections since 2020. Includes support contacts; the subject matter is distressing.'
