title: "Social Psychology (12th Edition): A Companion for Software Engineers"
author: kushal
summary: "Concept-first companion to Aronson, Lewis, Page-Gould, Sommers and Wilson's twelfth edition: construal and the power of the situation, research methods and open science, culture, the self and dissonance, social cognition and heuristics, attribution, attitudes and persuasion, prejudice, groups, conformity and obedience, helping, aggression, attraction, and the applied chapters on sustainability, health and law. Questions are framed in software, DevOps and team settings, and every explanation teaches the concept in full so the quizzes stand on their own."
date: 2026-11-13
tags:
