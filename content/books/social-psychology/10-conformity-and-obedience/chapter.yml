title: 'Social Influence: Conformity and Obedience'
summary: Informational and normative social influence, the Sherif and Asch studies, when people conform, minority influence, injunctive, descriptive and dynamic norms, the boomerang effect, foot-in-the-door and door-in-the-face, and Milgram's obedience studies and why people obey (book pp. 262–304).
