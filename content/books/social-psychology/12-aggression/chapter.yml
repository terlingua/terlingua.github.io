title: 'Aggression: Why Do We Hurt Other People? Can We Prevent It?'
summary: Hostile and instrumental aggression; evolutionary, hormonal, cultural, gender and learning explanations; alcohol, pain and heat; frustration, provocation and weapons cues; institutional violence, dehumanization and compassion collapse; media violence; and what does and doesn't reduce aggression, from punishment and catharsis to apologies, empathy and inclusion (book pp. 336–368).
