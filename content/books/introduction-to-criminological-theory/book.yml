title: 'An Introduction to Criminological Theory (4th Edition): A Companion for Software Engineers'
author: kushal
date: 2026-11-14
summary: 'Concept-first companion to Roger Hopkins Burke''s fourth edition (Routledge, 2014): the rational, predestined and victimized actor models, integrated theories and crime in an age of moral uncertainty, chapter by chapter in the book''s order. Each section explains the ideas in plain language, maps them onto software, DevOps, security and platform work, and ends with questions whose explanations teach the concept in full, quote the book with page pointers and cite the primary sources.'
