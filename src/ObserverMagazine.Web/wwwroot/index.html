<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terlingua Magazine</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="alternate" type="application/rss+xml" title="Terlingua Magazine RSS" href="/feed.xml" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="ObserverMagazine.Web.styles.css" />
    <script type="importmap"></script>
    <noscript><style>.app-loading { display: none; }</style></noscript>
</head>
<body>
    <div id="app">
        <p class="app-loading">Loading Terlingua Magazine…</p>
        <noscript>
            <div class="app-failure">
                <h1>JavaScript is required</h1>
                <p>Terlingua Magazine runs in your browser with WebAssembly. Turn on JavaScript and reload the page.</p>
            </div>
        </noscript>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <template id="boot-error-template">
        <div class="app-failure" role="alert">
            <h1>Unable to start Terlingua Magazine in this browser</h1>
            <p>This site supports only the current versions of Chrome, Edge, Firefox and Safari.</p>
            <pre></pre>
        </div>
    </template>

    <script>
        (() => {
            const app = document.getElementById('app');
            const template = document.getElementById('boot-error-template');
            let log = null;

            const report = (kind, detail) => {
                if (!log) {
                    const loading = app.querySelector('.app-loading');
                    if (!loading) return;
                    const card = template.content.firstElementChild.cloneNode(true);
                    log = card.querySelector('pre');
                    loading.replaceWith(card);
                }
                if (!log.isConnected) return;
                log.textContent += `${log.textContent ? '\n' : ''}[${kind}] ${detail}`;
            };

            const describe = (reason) => {
                if (reason instanceof Error) return `${reason.name}: ${reason.message}`;
                try {
                    return String(reason);
                } catch (error) {
                    return 'Unknown error';
                }
            };

            addEventListener('error', (event) => {
                if (event.target instanceof HTMLScriptElement) {
                    report('resource error', `Failed to load ${event.target.src}`);
                } else if (event instanceof ErrorEvent) {
                    const where = event.filename ? ` (${event.filename}:${event.lineno}:${event.colno})` : '';
                    report('error', `${event.message}${where}`);
                }
            }, true);

            addEventListener('unhandledrejection', (event) => report('unhandledrejection', describe(event.reason)));
        })();
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>
</html>
